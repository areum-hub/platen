# main 에 병합되면 이 저장소가 GitHub Pages 로 배포된다.
# 빌드 단계가 없다. 저장소 루트를 그대로 GitHub Pages 에 올린다.
# 주의: fork 에서는 CNAME 을 쓰지 않는다. 원본의 CNAME(memo.dante-labs.com)이 남아 있으면
#       Pages 가 그 도메인을 이 fork 에 붙이려 해서 원본 운영 사이트와 충돌한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
      - name: Pages 설정
        uses: actions/configure-pages@v5
      - name: 사이트 파일 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
